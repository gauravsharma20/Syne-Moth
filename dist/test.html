body { background: var(--chassis); color: var(--ink); }

/* SYNE CHORD — a landscape chord instrument. One plate across the top carries the function buttons and the display;
   below it, the chord keys, the two dials and the one-octave keyboard. Hold a function button, then turn a dial or
   press a key: that is the whole interface. Options holds the rest. */
html, body { height: 100%; }
html { box-sizing: border-box; -webkit-text-size-adjust: 100%; }
*, *::before, *::after { box-sizing: inherit; }
body { overflow: hidden; overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; background: var(--sy-grain), var(--chassis); }
#app { height: 100%; position: relative; }
.vh { position: absolute; left: -9999px; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
html:not(.kbd) :is(button, .sy-knob__body, [tabindex]):focus-visible { outline: none; }

.shell { height: 100%; display: flex; align-items: center; justify-content: center;
  padding: 6px max(10px, env(safe-area-inset-right, 0px)) 6px max(10px, env(safe-area-inset-left, 0px)); }
/* top and bottom insets (status bar, a host's title bar, the home indicator) are kept off the page by the root padding */
.dev { position: relative; width: 100%; max-width: 1040px; height: 100%; max-height: 520px; display: flex; flex-direction: column; gap: var(--gap, 10px); touch-action: none; }

/* top plate: function buttons either side of the display */
.plate { flex: none; display: flex; align-items: center; gap: var(--gap, 10px); padding: 8px 12px; border-radius: var(--radius-md);
  background: var(--sy-grain), linear-gradient(180deg, var(--sheen-soft), transparent 40%), var(--chassis-raised); box-shadow: var(--shadow-plate); position: relative; }
.grp { display: flex; align-items: flex-start; justify-content: space-around; gap: var(--fgap, 0px); flex: 1 1 auto; min-width: 0; }
.fb { display: flex; flex-direction: column; align-items: center; gap: 3px; width: var(--fw, 48px); }
.fb .sy-legend { font-size: 8px; line-height: 10px; letter-spacing: .08em; white-space: nowrap; }
@media (max-width: 720px) { .fb .sy-legend { font-size: 7px; letter-spacing: .03em; } }
.fb .sy-legend.is-on { color: var(--ink); }
.fb .sy-push { --p: var(--pp, 28px); }
.fb .sy-push:focus { outline: none; }

/* display */
.lcd { flex: 1 1 auto; min-width: 0; align-self: stretch; position: relative; padding: 5px 6px; border-radius: var(--radius-xs); background: var(--lcd); display: flex; align-items: center; justify-content: center; overflow: hidden;
  box-shadow: var(--shadow-well), 0 0 0 1px var(--seam), 0 0 0 5px var(--chassis-raised), 0 0 0 6px var(--shade); margin: 6px; }
.lcd canvas { display: block; }
.lcd::after { content: ''; position: absolute; inset: 0; pointer-events: none; background: linear-gradient(165deg, var(--sheen-soft) 0, transparent 36%), linear-gradient(0deg, var(--shade), transparent 28%); opacity: .65; }

/* deck: dial over the wheels on the left; the chord keys in one row over the keyboard on the right */
.deck { flex: 1 1 auto; min-height: 0; display: grid; grid-template-columns: var(--left, 120px) minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); gap: var(--gap, 10px); }
.dialcell { grid-column: 1; grid-row: 1; display: flex; align-items: center; justify-content: center; min-width: 0; }
.dialcell .sy-ctl { gap: 2px; }
.dialcell .sy-readout { font-size: 10px; line-height: 12px; min-height: 12px; white-space: nowrap; max-width: calc(var(--left) + 10px); overflow: hidden; text-overflow: ellipsis; }
.dialcell .sy-legend { font-size: 7.5px; line-height: 10px; letter-spacing: .12em; white-space: nowrap; }
.dial .sy-readout { color: var(--ink); } .dial .sy-legend { color: var(--ink-muted); }
.dialcell .sy-knob__wrap { will-change: transform; transform: translateZ(0); }
.chords { grid-column: 2; grid-row: 1; align-self: center; display: block; }
.chords .sy-strip__row { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 5px; }
.chords .sy-key { --k: 100%; width: 100%; height: var(--ck, 56px); }
.chords .sy-key__dish { inset: 10% 20% 32%; }
.chords .sy-key__legend { font-size: 8px; bottom: 5px; color: var(--ink); letter-spacing: .1em; }
.chords .k-ext .sy-key__legend { font: 500 10px/10px var(--font-mono); letter-spacing: 0; bottom: 4px; text-transform: none; }
.chords .is-auto .sy-key__legend { color: var(--ink-muted); }
.chords .sy-key__led { top: 39%; }  /* the middle of the dish (10% .. 68%) */
.chords.is-params .sy-key__legend { color: var(--ink); font-size: 7.5px; letter-spacing: .06em; }
.chords .is-blank { opacity: .45; cursor: default; }
.wheels { grid-column: 1; grid-row: 2; min-height: 0; display: flex; justify-content: center; gap: 14px; padding: 8px 8px 6px; border-radius: var(--radius-md);
  background: var(--sy-grain), linear-gradient(180deg, var(--sheen-soft), transparent 40%), var(--chassis-raised); box-shadow: var(--shadow-plate); }
.wheelcol { display: flex; flex-direction: column; align-items: center; gap: 3px; min-height: 0; }
.wheelcol .sy-readout { font-size: 9.5px; line-height: 11px; min-height: 11px; }
.wheelcol .sy-legend { font-size: 7.5px; line-height: 10px; letter-spacing: .12em; }
.wheel { position: relative; width: var(--wheel, 40px); flex: 1 1 auto; min-height: 70px; touch-action: none; cursor: ns-resize; -webkit-tap-highlight-color: transparent; }
.wheel:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }
html:not(.kbd) .wheel:focus-visible { outline: none; }
.wheel__slot { position: absolute; inset: 0; border-radius: 8px; background: var(--chassis-sunk); box-shadow: var(--shadow-well), 0 0 0 1px var(--shade), 0 1px 0 1px var(--sheen-soft); }
.wheel__drum { position: absolute; left: 17%; right: 17%; top: 7%; bottom: 7%; border-radius: 5px; overflow: hidden;
  background:
    repeating-linear-gradient(180deg, rgba(255,255,255,.09) 0 1.5px, rgba(0,0,0,.42) 1.5px 4.5px),
    linear-gradient(180deg, #000000 0, color-mix(in oklab, var(--knob-black), white 6%) 16%, color-mix(in oklab, var(--knob-black), white 20%) 50%, color-mix(in oklab, var(--knob-black), white 6%) 84%, #000000 100%);
  background-size: 100% 4.5px, 100% 100%; background-position: 0 var(--ribs, 0px), 0 0;
  box-shadow: inset 0 0 0 1px #000000, inset 3px 0 4px -2px rgba(255,255,255,.18), inset -3px 0 4px -2px rgba(0,0,0,.6), 0 2px 3px var(--shade-deep); }
.wheel.is-pitch:not(.is-dragging) .wheel__drum { transition: background-position 220ms var(--sy-ease-spring); }
.wheel__mark { position: absolute; left: 0; right: 0; top: calc(50% - var(--tilt, 0%)); height: 3px; margin-top: -1.5px; background: var(--signal); box-shadow: 0 0 4px color-mix(in oklab, var(--signal) 60%, transparent); }
.wheel.is-pitch:not(.is-dragging) .wheel__mark { transition: top 220ms var(--sy-ease-spring); }
.wheel__centre { position: absolute; left: -5px; right: -5px; top: 50%; height: 0; pointer-events: none; }
.wheel__centre::before, .wheel__centre::after { content: ''; position: absolute; top: -1px; width: 4px; height: 2px; background: var(--ink-faint); }
.wheel__centre::before { left: 0; } .wheel__centre::after { right: 0; }
.keys { grid-column: 2; grid-row: 2; min-width: 0; min-height: 0; display: flex; flex-direction: column; }

/* keyboard: one octave of matte silicone keys in a sunk tray, sharps set back above the naturals */
.keys { min-width: 0; min-height: 0; display: flex; flex-direction: column; gap: 4px; }
.keys__bar { display: flex; align-items: center; justify-content: space-between; padding: 0 2px; }
.keys__bar .sy-legend { font-size: 7.5px; }
.keys__bar .sy-legend b { color: var(--signal-ink); font-weight: 600; }
.oct { display: inline-flex; align-items: center; gap: 6px; }
.oct .ukey { height: 22px; width: 28px; padding: 0; justify-content: center; font-size: 12px; letter-spacing: 0; }
.oct .sy-readout { font-size: 10px; min-width: 40px; text-align: center; }
/* the keybed: a sunk well with a rail across the top; naturals run up under the rail, sharps stand on them */
.keybed { flex: 1 1 auto; min-height: 0; position: relative; padding: 0 6px 6px; border-radius: var(--radius-md); background: var(--chassis-sunk);
  box-shadow: var(--shadow-well), 0 0 0 1px var(--shade), 0 1px 0 1px var(--sheen-soft); overflow: hidden; }
.keybed__keys { position: absolute; left: 6px; right: 6px; top: 4px; bottom: 6px; }
.keybed__rail { position: absolute; left: 0; right: 0; top: 0; height: 15px; z-index: 3; pointer-events: none; display: flex; align-items: center; justify-content: space-between; padding: 0 10px;
  background: var(--sy-grain), linear-gradient(180deg, var(--sheen-soft), transparent 70%), var(--chassis-raised);
  box-shadow: 0 1px 0 var(--sheen-soft) inset, 0 2px 0 var(--seam), 0 5px 7px -2px var(--shade-deep); }
.keybed .sy-pad { position: absolute; top: 0; height: auto; --ps: auto; min-width: 0; transform-origin: 50% 0; }
.keybed .sy-pad:focus { outline: none; }
.keybed .k-w { bottom: 0; border-radius: 2px 2px 7px 7px; }
.keybed .k-b { height: 60%; z-index: 2; border-radius: 2px 2px 5px 5px;
  --pad: color-mix(in oklab, var(--knob-black) 86%, var(--chassis)); --pad-edge: #000000; }
.keybed .k-b:not(.is-lit) { box-shadow: 0 0 0 1.5px #000000, inset 0 1px 1px rgba(255,255,255,.14), inset 0 -5px 0 rgba(255,255,255,.07), inset 0 -7px 6px -4px rgba(0,0,0,.6),
  3px 7px 9px -3px var(--shade-deep), -2px 5px 7px -4px var(--shade); }
.keybed .k-w:not(.is-lit) { box-shadow: 0 0 0 1.5px var(--pad-edge), inset 0 -5px 0 color-mix(in oklab, var(--pad), black 7%), inset 0 -6px 4px -3px var(--shade), 0 2px 2px var(--shade); }
.keybed .sy-pad.is-down { transform: translateY(1.5px) scaleY(.992); }
